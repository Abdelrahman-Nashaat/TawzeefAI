[project]
name = "tawzeefai-backend"
version = "0.1.0"
description = "Local development backend for the TawzeefAI capstone"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "langgraph>=1,<2",
    "langchain-core>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]

[project.optional-dependencies]
semantic = [
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "sqlite-vec==0.1.9",
    "tokenizers>=0.21,<1",
]
postgres = [
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
